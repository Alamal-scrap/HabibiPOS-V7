function uid(){return Math.random().toString(36).slice(2,10)}function money(n){return Number(n||0).toFixed(2)}function load(){let s;try{s=JSON.parse(localStorage.getItem(DB))}catch(e){}if(!s){s={orderNo:1001,categories:DEFAULT_CATEGORIES,items:DEFAULT_ITEMS.map(x=>({...x,id:uid()})),users:[{id:uid(),username:'admin',password:'1234',role:'Admin',active:true},{id:uid(),username:'cashier',password:'1234',role:'Cashier',active:true}],sales:[],shifts:[]};try{localStorage.setItem(DB,JSON.stringify(s))}catch(e){console.warn("Storage unavailable",e)}}return s}// V7: durable asynchronous IndexedDB, with localStorage fallback when permitted.
let posDatabase=null, posStorageMode='none', posSaving=false;
function openPOSDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB not supported'));let req=indexedDB.open('HabibiPOS_V7',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('records'))req.result.createObjectStore('records')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('Database unavailable'))})}
function idbRead(db){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readonly'),r=tx.objectStore('records').get('pos');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function idbWrite(db,value){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').put(value,'pos');tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||Error('Database write failed'));tx.onabort=()=>reject(tx.error||Error('Database write aborted'))})}
async function save(){try{let snapshot=JSON.parse(JSON.stringify(state));if(posStorageMode==='indexeddb'){await idbWrite(posDatabase,snapshot)}else if(posStorageMode==='localstorage'){localStorage.setItem(DB,JSON.stringify(snapshot))}else throw Error('No persistent storage available');return true}catch(e){console.error('POS save failed',e);alert('SAVE FAILED: This file viewer does not allow reliable storage. Order NOT completed. Open the POS in Chrome using an HTTPS website or install the Android app.');return false}}
async function bootPOS(){let loginButton=document.querySelector('#login button.primary');if(loginButton)loginButton.disabled=true;try{posDatabase=await openPOSDatabase();posStorageMode='indexeddb';let existing=await idbRead(posDatabase);if(existing)state=existing;else{state=load();await save()}}catch(e){console.warn('IndexedDB unavailable',e);try{localStorage.setItem('__habibi_test','1');localStorage.removeItem('__habibi_test');posStorageMode='localstorage';state=load()}catch(err){posStorageMode='none';state=load();alert('This Android file viewer blocks permanent storage. Do not use it to record sales. Open this file from a secure HTTPS website or the Android APK instead.')}}if(loginButton)loginButton.disabled=false;let note=document.createElement('div');note.style.cssText='margin:10px 0;font-size:13px;font-weight:700';note.textContent=posStorageMode==='indexeddb'?'Storage: IndexedDB ready':posStorageMode==='localstorage'?'Storage: localStorage fallback':'STORAGE UNAVAILABLE — DO NOT RECORD SALES';note.style.color=posStorageMode==='none'?'#b42318':'#17634d';document.querySelector('.login-card')?.appendChild(note)}

function fitCategoryGrid(){
 const grid=document.getElementById('grid');if(!grid||!grid.querySelector('.product'))return;
 const count=grid.querySelectorAll('.product').length;const width=grid.clientWidth-8,height=grid.clientHeight-12;
 if(width<=0||height<=0)return;
 let best=null;
 for(let cols=2;cols<=Math.min(count,9);cols++){
  const rows=Math.ceil(count/cols),cardW=(width-(cols-1)*8)/cols,cardH=(height-(rows-1)*8)/rows;
  if(cardW<165||cardH<92)continue;
  const score=Math.min(cardW/205,1.25)*Math.min(cardH/115,1.15);
  if(!best||score>best.score)best={cols,cardH,score};
 }
 if(!best){const cols=Math.max(2,Math.floor(width/175));best={cols,cardH:Math.max(92,Math.floor((height-(Math.ceil(count/cols)-1)*8)/Math.ceil(count/cols)))}}
 grid.style.setProperty('--fit-cols',best.cols);grid.style.setProperty('--fit-row',Math.floor(best.cardH)+'px');
 grid.style.setProperty('--fit-img',Math.max(40,Math.floor(best.cardH-52))+'px');
}

async function baseSaveSale(method){let sh=openShift();if(!sh)return alert('Please start shift first.');let sale={id:uid(),order:state.orderNo,method,total:Number(total().toFixed(2)),items:cart.map(i=>({...i})),date:new Date().toISOString(),user:currentUser.username,userId:currentUser.id,shiftId:sh.id,orderType:orderType,status:'PAID'};state.sales.push(sale);state.orderNo++;if(!(await save())){state.sales.pop();state.orderNo--;return null}lastSale=sale;buildReceipt(sale);cart=[];renderCart();renderShift();return sale}function completeSale(method){if(total()<=0)return alert('Please add items first.');let s=saveSale(method);toast(method+' saved');}
function tlv(id,value){value=String(value);return id+String(value.length).padStart(2,'0')+value}function crc16ccitt(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF}}return crc.toString(16).toUpperCase().padStart(4,'0')}function buildPayNowPayload(amount,ref){const mai=tlv('00','SG.PAYNOW')+tlv('01','0')+tlv('02',STORE.paynowMobile)+tlv('03','0');let p='';p+=tlv('00','01');p+=tlv('01','12');p+=tlv('26',mai);p+=tlv('52','0000');p+=tlv('53','702');p+=tlv('54',money(amount));p+=tlv('58','SG');p+=tlv('59',STORE.merchant.substring(0,25));p+=tlv('60',STORE.city);p+=tlv('62',tlv('01',ref));p+='6304';return p+crc16ccitt(p)}
function openPayNow(){if(total()<=0)return alert('Please add items first.');let amount=Number(total().toFixed(2)),ref='HD'+state.orderNo,payload=buildPayNowPayload(amount,ref);showModal(`<h2>Scan to Pay</h2><p><b>${STORE.merchant}</b><br>Order #${state.orderNo} • Ref: ${ref}</p><div class="grand">S$${money(amount)}</div><div class="qrbox"><img id="qrimg" style="width:300px;height:300px"></div><p>Customer should see the amount after scanning.</p><div style="display:flex;gap:10px"><button class="secondary" style="flex:1" onclick="closeModal()">Cancel</button><button class="primary" style="flex:1" onclick="confirmPayNow()">Payment Received</button></div>`);setTimeout(()=>{document.getElementById('qrimg').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(payload);},50)}function confirmPayNow(){let s=saveSale('Dynamic PayNow QR');if(!s)return;closeModal();toast('PayNow saved');}
